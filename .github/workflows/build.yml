name: Build Questy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-latest
            asset: questy-windows.exe
            source: questy.exe

          - name: Linux
            os: ubuntu-latest
            asset: questy-linux
            source: questy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller \
            --onefile \
            --name questy \
            --collect-all textual \
            --collect-all rich \
            --collect-submodules modules \
            questy.py

      - name: Rename executable
        shell: bash
        run: |
          mv "dist/${{ matrix.source }}" "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}